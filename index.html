<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volkbyte</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="icons/favicon.png">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Background Canvas for Particles -->
    <canvas id="particleCanvas"></canvas>

    <!-- Background Grid Lines -->
    <div class="bg-layer bg-grid"></div>

    <!-- Background Crimson Radial Glow -->
    <div class="bg-layer glow-vignette"></div>

    <!-- Central Glowing Core Backlight -->
    <div class="bg-layer core-backlight"></div>

    <!-- Main Interactive Container -->
    <main class="content">

        <!-- Logo Wrapper with Interactive Hover Effects -->
        <div class="logo-wrapper">
            <!-- Main Volkbyte Wolf SVG Icon -->
            <div class="logo-icon">
                <img src="icons/icon.svg" alt="Volkbyte Logo" class="full-size">
            </div>
        </div>

        <!-- Only Requested Text: "Hallo :3c" -->
        <h1 class="headline">
            Hallo :3c
        </h1>

    </main>

    <!-- Theme Toggle (top right) -->
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle light theme" title="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    </button>

    <!-- Scripts -->
    <script src="js/theme.js"></script>
    <script src="js/particles.js"></script>
</body>
</html>
